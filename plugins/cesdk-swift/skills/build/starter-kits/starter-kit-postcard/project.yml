name: StarterKit-PostcardEditor
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: true
    SUPPORTS_MACCATALYST: false
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
targets:
  StarterKit-PostcardEditor:
    type: application
    platform: iOS
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: ly.img.starterkit.postcard-editor
      INFOPLIST_KEY_UILaunchScreen_Generation: true
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    sources:
      - path: StarterKit-PostcardEditor
      - path: StarterKit
    dependencies:
      - package: IMGLYUI
        product: IMGLYUI
packages:
  IMGLYUI:
    url: https://github.com/imgly/IMGLYUI-swift.git
    exactVersion: "1.83.0-nightly.20260902"
